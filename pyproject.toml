[project]
name = "everand-books"
version = "0.1.0"
description = "Download Everand books you can read and package them as EPUB files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5",
    "nicegui>=3",
    "pathvalidate>=3",
    "pillow>=10",
    "pydantic>=2.7",
    "pydantic-settings>=2",
    "selectolax>=0.3",
    "typer>=0.12",
]

[project.scripts]
everand-books-gui = "everand_books.interfaces.nicegui_app:run"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-cov",
    "import-linter",
    "pre-commit",
    "pytest-asyncio",
    "types-lxml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everand_books"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle (PEP 8)
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade: List->list, Optional[X]->X | None, PEP 695
    "ANN",      # require annotations
    "ASYNC",    # blocking calls in async code
    "B",        # bugbear
    "A",        # shadowing builtins
    "C4",       # comprehensions
    "C90",      # complexity (mccabe)
    "SIM",      # simplify
    "PL",       # pylint: max-args, max-statements, magic values
    "RET",      # return consistency
    "TRY",      # exception handling
    "BLE",      # blind except
    "EM",       # exception message formatting
    "FBT",      # boolean trap (flag parameters)
    "PTH",      # pathlib
    "T20",      # no print
    "LOG", "G", # logging: getLogger(__name__), lazy %s arguments instead of f-strings
    "S",        # security
    "PT",       # pytest style
    "ARG",      # unused arguments
    "ERA",      # commented-out code
    "TC",       # type-checking-only imports
    "RUF",      # ruff-specific
    "PERF",     # performance anti-patterns
    "DTZ",      # naive datetimes
    "ISC",      # implicit string concatenation
    "TID",      # banned relative imports
]
ignore = [
    "COM812", "ISC001",  # clash with the formatter
    "TRY003",         # long messages in exceptions are fine with EM rules on
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4          # 3 params + self; group more into a dataclass
max-statements = 20
max-branches = 8
max-returns = 4

[tool.ruff.lint.isort]
lines-after-imports = 2  # two empty lines between the imports and the first constant, function or class

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.flake8-bugbear]
# Allow framework "default = Depends(...)" style parameters
extend-immutable-calls = [
    "typer.Option", "typer.Argument",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "ARG", "FBT"]
"src/everand_books/__main__.py" = ["T20"]            # entry point may print
"src/everand_books/interfaces/cli.py" = ["T20", "FBT"]  # CLI output + boolean options are normal

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=everand_books --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------- coverage (fixed at 100%)
[tool.coverage.run]
branch = true
source = ["everand_books"]
# UI layout files hold no logic, so they are verified in a browser instead of by unit tests.
omit = [
    "*/interfaces/nicegui_app.py",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "everand_books"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces -> adapters -> services -> domain"
type = "layers"
layers = [
    "everand_books.interfaces",
    "everand_books.adapters",
    "everand_books.services",
    "everand_books.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure (no I/O or framework libraries)"
type = "forbidden"
source_modules = ["everand_books.domain"]
forbidden_modules = [
    "requests", "httpx", "sqlalchemy", "sqlite3", "fastapi", "nicegui", "reflex", "click", "typer",
    "psycopg", "asyncpg", "pymysql", "aiomysql", "aiosqlite",
]

[[tool.importlinter.contracts]]
name = "Core is UI-free (domain, services, adapters never import a UI framework)"
type = "forbidden"
source_modules = [
    "everand_books.domain", "everand_books.services", "everand_books.adapters",
]
forbidden_modules = [
    "fastapi", "starlette", "nicegui", "reflex", "typer", "click", "flask", "streamlit", "flet",
    "everand_books.interfaces",
]
